apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arkya-identity-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arkya-identity
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: replace-before-deploy
          podSelector:
            matchLabels:
              app.kubernetes.io/name: replace-before-deploy
      ports:
        - protocol: TCP
          port: 8080
