apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkya-identity
  labels:
    app.kubernetes.io/name: arkya-identity
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  # A single RWO key volume: no overlapping pods during an update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arkya-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arkya-identity
        app.kubernetes.io/part-of: arkya
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity
          image: arkya-identity:replace-before-deploy
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: arkya-identity-config
          env:
            - name: Mongo__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: arkya-identity-secrets
                  key: Mongo__ConnectionString
            - name: Discord__ClientId
              valueFrom:
                secretKeyRef:
                  name: arkya-identity-secrets
                  key: Discord__ClientId
            - name: Discord__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: arkya-identity-secrets
                  key: Discord__ClientSecret
            - name: ServiceAuthentication__Key
              valueFrom:
                secretKeyRef:
                  name: arkya-identity-secrets
                  key: ServiceAuthentication__Key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: management
              httpHeaders:
                - name: Host
                  value: identity.arkya.online
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
              httpHeaders:
                - name: Host
                  value: identity.arkya.online
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
              httpHeaders:
                - name: Host
                  value: identity.arkya.online
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: keys
              mountPath: /var/lib/arkya/keys
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: keys
          persistentVolumeClaim:
            claimName: arkya-identity-keys
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
