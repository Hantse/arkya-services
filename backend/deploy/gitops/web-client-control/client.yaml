apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkya-web-client
  namespace: arkya-beta
  annotations:
    arkya.online/source-revision: 3c4cc6e9e3887f92bc704aff0ad1ea6069bc1841
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: arkya-web-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arkya-web-client
      annotations:
        arkya.online/source-revision: 3c4cc6e9e3887f92bc704aff0ad1ea6069bc1841
    spec:
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: arkya-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: client
        image: ghcr.io/hantse/arkya-mmorpg-web-client:bootstrap-required
        ports:
        - name: http
          containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "1"
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 15
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: arkya-web-client
  namespace: arkya-beta
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arkya-web-client
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arkya-web-client
  namespace: arkya-beta
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arkya-web-client
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: arkya-beta
      podSelector:
        matchLabels:
          app.kubernetes.io/name: arkya-frontend
    ports:
    - port: 8080
      protocol: TCP
