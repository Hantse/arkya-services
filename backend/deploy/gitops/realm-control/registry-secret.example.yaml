# Contract only: this example is deliberately excluded from Kustomize.
# Supply the real value through the infrastructure's secret-management flow.
# auth = base64(UTF-8 GitHub username + ':' + classic PAT with read:packages).
# Base64 is not encryption. Never commit the populated Secret to this repository.
apiVersion: v1
kind: Secret
metadata:
  name: arkya-ghcr
  namespace: arkya-beta
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"auth":""}}}
