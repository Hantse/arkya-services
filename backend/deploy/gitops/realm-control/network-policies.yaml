apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arkya-realm-default-deny
  namespace: arkya-beta-realm
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arkya-beta-web-game-ingress
  namespace: arkya-beta-realm
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: arkya-realms
      arkya.online/server-id: island
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: arkya-beta
      podSelector:
        matchLabels:
          app.kubernetes.io/name: arkya-gateway
    ports:
    - port: 17943
      protocol: TCP
---
