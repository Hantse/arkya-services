apiVersion: v1
kind: ServiceAccount
metadata:
  name: arkya-realm-deployer
  namespace: arkya-beta
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arkya-realm-deployer
  namespace: arkya-beta-realm
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
rules:
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, create, patch, delete]
- apiGroups: ['']
  resources: [services]
  verbs: [get, create, delete]
- apiGroups: ['']
  resources: [pods]
  verbs: [get, list]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [arkya-ghcr, arkya-dedicated]
  verbs: [get, delete]
- apiGroups: ['']
  resources: [secrets]
  resourceNames: [arkya-dedicated]
  verbs: [patch]
# Kubernetes RBAC cannot constrain create by resourceName. Realms validates
# the fixed registry/dedicated Secret names and approved namespace first.
- apiGroups: ['']
  resources: [secrets]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arkya-realm-deployer
  namespace: arkya-beta-realm
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
subjects:
- kind: ServiceAccount
  name: arkya-realm-deployer
  namespace: arkya-beta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arkya-realm-deployer
