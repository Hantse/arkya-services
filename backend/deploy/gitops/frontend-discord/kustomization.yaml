apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arkya-beta
resources:
- ../beta
# Inherit the release digests promoted by CI; keep a single image source.
patches:
- target:
    kind: Deployment
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
- target:
    kind: Service
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: unused
- target:
    kind: NetworkPolicy
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: unused
- target:
    kind: ConfigMap
    name: arkya-(characters|content|realms|admin|backend)-config
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: unused
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: arkya-operations
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: arkya-admin-keys
      namespace: arkya-operations
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: arkya-frontend
      namespace: arkya-identity
- patch: |-
    apiVersion: v1
    kind: Namespace
    metadata:
      name: arkya-identity
      labels:
        app.kubernetes.io/name: arkya-beta
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-identity-config
      namespace: arkya-identity
    data:
      AllowedHosts: api.arkya.online;arkya-identity;arkya-identity.arkya-beta.svc.cluster.local
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-gateway-config
      namespace: arkya-identity
    data:
      AllowedHosts: api.arkya.online
      Gateway__CharactersEnabled: 'false'
      Gateway__AdminEnabled: 'false'
      Gateway__AdminAddress: http://arkya-admin.arkya-beta.svc.cluster.local:8080/
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://arkya-identity.arkya-beta.svc.cluster.local:8080/
      ReverseProxy__Clusters__characters__Destinations__primary__Address: http://arkya-characters.arkya-beta.svc.cluster.local:8080/
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: arkya-frontend
      namespace: arkya-identity
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local
      ports:
      - $patch: replace
      - name: http
        port: 80
        targetPort: http
- target:
    kind: NetworkPolicy
    name: arkya-frontend
  patch: |-
    - op: replace
      path: /spec/ingress
      value:
      - from:
        - ipBlock:
            cidr: 192.168.100.0/24
        ports:
        - protocol: TCP
          port: 8080
- target:
    kind: NetworkPolicy
    name: arkya-identity
  patch: |-
    - op: replace
      path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
      value: arkya-beta
    - op: replace
      path: /spec/ingress/1/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
      value: arkya-beta
- target:
    kind: Deployment
    name: arkya-frontend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
      value: arkya-frontend.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
      value: arkya-frontend.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/httpHeaders/0/value
      value: arkya-frontend.arkya-beta.svc.cluster.local
