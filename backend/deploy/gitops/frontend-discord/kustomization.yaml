apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../private-base
patches:
- target:
    kind: Deployment
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
- target:
    kind: Service
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: unused
- target:
    kind: NetworkPolicy
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: unused
- target:
    kind: ConfigMap
    name: arkya-(characters|content|realms|admin|backend)-config
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: unused
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: arkya-admin-keys
      namespace: arkya-beta
