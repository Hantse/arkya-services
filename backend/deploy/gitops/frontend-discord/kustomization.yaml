apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arkya-beta
resources:
- ../beta
# Inherit the release digests promoted by CI; keep a single image source.
patches:
- target:
    kind: Deployment
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
- target:
    kind: Service
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: unused
- target:
    kind: NetworkPolicy
    name: arkya-(characters|content|realms|admin|backend)
  patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: unused
- target:
    kind: ConfigMap
    name: arkya-(characters|content|realms|admin|backend)-config
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: unused
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: arkya-operations
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: arkya-admin-keys
      namespace: arkya-operations
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: arkya-frontend
      namespace: arkya-identity
- patch: |-
    $patch: delete
    apiVersion: v1
    kind: Namespace
    metadata:
      name: arkya-identity
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-identity-config
      namespace: arkya-identity
    data:
      AllowedHosts: api.arkya.online;arkya-identity;arkya-identity.arkya-beta.svc.cluster.local
      Kestrel__Endpoints__Internal__Url: null
      Kestrel__Endpoints__Internal__Certificate__Path: null
      Kestrel__Endpoints__Internal__Certificate__KeyPath: null
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: arkya-identity
      namespace: arkya-identity
    spec:
      template:
        spec:
          containers:
          - name: identity
            ports:
            - containerPort: 8443
              $patch: delete
            volumeMounts:
            - mountPath: /etc/arkya/tls
              $patch: delete
          volumes:
          - name: tls
            $patch: delete
- patch: |-
    apiVersion: v1
    kind: Service
    metadata:
      name: arkya-identity
      namespace: arkya-identity
    spec:
      ports:
      - port: 8443
        $patch: delete
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-gateway-config
      namespace: arkya-identity
    data:
      AllowedHosts: api.arkya.online;arkya.online
      Gateway__CharactersEnabled: 'false'
      Gateway__AdminEnabled: 'false'
      Gateway__FrontendEnabled: 'true'
      Gateway__FrontendHost: arkya.online
      Gateway__FrontendAddress: http://arkya-frontend.arkya-beta.svc.cluster.local:8080/
      Gateway__AdminAddress: http://arkya-admin.arkya-beta.svc.cluster.local:8080/
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://arkya-identity.arkya-beta.svc.cluster.local:8080/
      ReverseProxy__Clusters__characters__Destinations__primary__Address: http://arkya-characters.arkya-beta.svc.cluster.local:8080/
# Finish the gateway rollout before retiring the previous direct frontend access.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: arkya-gateway
      namespace: arkya-identity
      annotations:
        argocd.argoproj.io/sync-wave: '-1'
- target:
    kind: Service|NetworkPolicy
    name: arkya-frontend
  patch: |-
    - op: replace
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: '0'
- target:
    kind: NetworkPolicy
    name: arkya-frontend
  patch: |-
    - op: replace
      path: /spec/ingress
      value:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arkya-gateway
        ports:
        - protocol: TCP
          port: 8080
- target:
    kind: NetworkPolicy
    name: arkya-identity
  patch: |-
    - op: replace
      path: /spec/ingress
      value:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arkya-gateway
        ports:
        - protocol: TCP
          port: 8080
- target:
    kind: Deployment
    name: arkya-frontend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
      value: arkya-frontend.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
      value: arkya-frontend.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/httpHeaders/0/value
      value: arkya-frontend.arkya-beta.svc.cluster.local
