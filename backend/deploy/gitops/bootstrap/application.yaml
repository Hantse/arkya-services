apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arkya-beta
  namespace: argocd
spec:
  project: arkya-beta
  sources:
  - repoURL: git@github.com:Hantse/arkya-services.git
    targetRevision: master
    path: backend/deploy/gitops/beta
  - repoURL: git@github.com:Hantse/arkya-mmorpg.git
    targetRevision: main
    path: deploy/gitops/beta
  destination:
    server: https://kubernetes.default.svc
    namespace: arkya-identity
  revisionHistoryLimit: 10
  syncPolicy:
    syncOptions:
    - PruneLast=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
