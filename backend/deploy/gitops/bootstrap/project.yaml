apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arkya-beta
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  description: Arkya beta services and Unity deployment from their owning repositories.
  sourceRepos:
  - git@github.com:Hantse/arkya-services.git
  - git@github.com:Hantse/arkya-mmorpg.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: arkya-beta
  - server: https://kubernetes.default.svc
    namespace: arkya-identity
  - server: https://kubernetes.default.svc
    namespace: arkya-operations
  - server: https://kubernetes.default.svc
    namespace: arkya-realm-beta-web
  - server: https://kubernetes.default.svc
    namespace: arkya-beta-realm
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: Pod
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: apps
    kind: Deployment
  - group: apps
    kind: ReplicaSet
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: networking.k8s.io
    kind: Ingress
