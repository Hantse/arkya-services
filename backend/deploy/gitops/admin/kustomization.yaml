apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
- ../inference-control
- ../reports-control
- ../web-client-control
resources:
- ../private-base
- ../realm-control
- player-management-network-policy.yaml
patches:
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-frontend-config
      namespace: arkya-beta
    data:
      ARKYA_UNITY_UPSTREAM: arkya-web-client.arkya-beta.svc.cluster.local:8080
- target:
    kind: Deployment
    name: arkya-backend
  patch: |-
    $patch: delete
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: unused
- target:
    kind: Service
    name: arkya-backend
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: Service
    metadata:
      name: unused
- target:
    kind: NetworkPolicy
    name: arkya-backend
  patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: unused
- target:
    kind: ConfigMap
    name: arkya-backend-config
  patch: |-
    $patch: delete
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: unused
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-gateway-config
      namespace: arkya-beta
    data:
      AllowedHosts: api.arkya.online;arkya.online;admin.arkya.online;*.arkya.online;*.admin.arkya.online
      Gateway__AdminEnabled: 'true'
      Gateway__CharactersEnabled: 'true'
      Gateway__ContentEnabled: 'true'
      Gateway__PublicRealmsEnabled: 'true'
      Gateway__PublicRealmsAddress: http://arkya-realms.arkya-beta.svc.cluster.local:8080/
      Gateway__RealmSitesEnabled: 'true'
      Gateway__RealmBaseDomain: arkya.online
      ReverseProxy__Clusters__content__Destinations__primary__Address: http://arkya-content.arkya-beta.svc.cluster.local:8080/
      Gateway__RealmGameEnabled: 'true'
      Gateway__RealmGameAddress: http://arkya-beta-web-island.arkya-beta-realm.svc.cluster.local:17943/
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-admin-config
      namespace: arkya-beta
    data:
      AllowedHosts: admin.arkya.online;*.admin.arkya.online;arkya-admin;arkya-admin.arkya-beta.svc.cluster.local
      RealmSites__Enabled: 'true'
      RealmSites__BaseDomain: arkya.online
      Admin__DiscordEnabled: 'true'
      Admin__AllowedDiscordUserIds__0: '195861708248449024'
      Discord__PublicBaseUrl: https://admin.arkya.online
      ContentApi__AllowClusterHttp: 'true'
      ContentApi__BaseUrl: http://arkya-content.arkya-beta.svc.cluster.local:8080/
      ItemVisualExport__Enabled: 'true'
      RealmsApi__AllowClusterHttp: 'true'
      RealmsApi__BaseUrl: http://arkya-realms.arkya-beta.svc.cluster.local:8080/
      IdentityAdminApi__Enabled: 'true'
      IdentityAdminApi__AllowClusterHttp: 'true'
      IdentityAdminApi__BaseUrl: http://arkya-identity.arkya-beta.svc.cluster.local:8080/
      CharactersAdminApi__Enabled: 'true'
      CharactersAdminApi__AllowClusterHttp: 'true'
      CharactersAdminApi__BaseUrl: http://arkya-characters.arkya-beta.svc.cluster.local:8080/
      SSL_CERT_FILE: null
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-identity-config
      namespace: arkya-beta
    data:
      Administration__Enabled: 'true'
      Administration__AllowClusterHttp: 'true'
      InternalHttp__AllowedNetworks__0: 10.42.0.0/16
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-characters-config
      namespace: arkya-beta
    data:
      AllowedHosts: api.arkya.online;arkya-characters;arkya-characters.arkya-beta.svc.cluster.local
      ASPNETCORE_HTTP_PORTS: '8080'
      Identity__BaseUrl: http://arkya-identity.arkya-beta.svc.cluster.local:8080/
      Identity__AllowClusterHttp: 'true'
      Realms__BaseUrl: http://arkya-realms.arkya-beta.svc.cluster.local:8080/
      Realms__AllowClusterHttp: 'true'
      GameAccess__RequireBetaAccess: 'true'
      GameAccess__AllowPrivateHttp: 'true'
      RealmRuntime__DynamicRealmsEnabled: 'true'
      RealmRuntime__RealmId: beta-web
      RealmRuntime__ServerId: island
      GameAccess__DedicatedServers__0__RealmId: null
      GameAccess__DedicatedServers__0__ServerId: null
      InternalHttp__AllowedNetworks__0: 10.42.0.0/16
      InternalHttp__AllowedNetworks__1: 192.168.100.0/24
      Kestrel__Endpoints__Internal__Url: null
      Kestrel__Endpoints__Internal__Certificate__Path: null
      Kestrel__Endpoints__Internal__Certificate__KeyPath: null
      SSL_CERT_FILE: null
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-content-config
      namespace: arkya-beta
    data:
      AllowedHosts: api.arkya.online;arkya-content;arkya-content.arkya-beta.svc.cluster.local
- patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: arkya-realms-config
      namespace: arkya-beta
    data:
      AllowedHosts: arkya-realms;arkya-realms.arkya-beta.svc.cluster.local
      Deployment__Enabled: 'true'
      Deployment__DeploymentTimeoutSeconds: '900'
      Deployment__ApiServer: https://kubernetes.default.svc
      Deployment__TokenFile: /var/run/secrets/arkya-kubernetes/token
      Deployment__CertificateAuthorityFile: /var/run/secrets/arkya-kubernetes/ca.crt
      Deployment__Targets__0__Id: beta-web
      Deployment__Targets__0__DisplayName: Serveur principal
      Deployment__Targets__0__Namespace: arkya-beta-realm
      Deployment__Profiles__0__Id: beta-web
      Deployment__Profiles__0__DisplayName: Île de départ · serveur WebSocket
      Deployment__Profiles__0__Image: ghcr.io/hantse/arkya-mmorpg-dedicated@sha256:50420fc55c7c7e75448e38a2e92098eb050fe84ef43dce66af4cdcc5c1da5a75
      Deployment__Profiles__0__ImagePullSecretName: arkya-ghcr
      Deployment__ImageReleases__0__RealmId: beta-web
      Deployment__ImageReleases__0__ProfileId: beta-web
      Deployment__ImageReleases__0__Version: '3'
      Deployment__ImageReleases__0__PreviousImage: ghcr.io/hantse/arkya-mmorpg-dedicated@sha256:a8fed3c9eb50312f970989f93af8c23c19881ab4d833f45197cfd1e931cbe74c
      Deployment__Profiles__0__Servers__0__Id: island
      Deployment__Profiles__0__Servers__0__Port: '17943'
      Deployment__Profiles__0__Servers__0__Transport: WebSocket
      Deployment__Profiles__0__Servers__0__PublicEndpoint: wss://api.arkya.online/game/beta-web/
      Deployment__Profiles__0__Servers__0__ProtocolVersion: '1'
      Deployment__Profiles__0__Servers__0__BuildId: arkya-web-beta-v1
      RealmRuntime__CharactersBaseUrl: http://arkya-characters.arkya-beta.svc.cluster.local:8080/
      RealmRuntime__AllowClusterHttp: 'true'
      RealmRuntime__RegistryDockerConfigFile: /var/run/secrets/arkya-registry/config.json
      GameAccess__StandaloneEntries__0__Enabled: 'false'
- target:
    kind: ConfigMap
    name: arkya-(content|realms)-config
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: unused
    data:
      ASPNETCORE_HTTP_PORTS: '8080'
      InternalHttp__AllowedNetworks__0: 10.42.0.0/16
      InternalHttp__AllowedNetworks__1: 192.168.100.0/24
      Kestrel__Endpoints__Internal__Url: null
      Kestrel__Endpoints__Internal__Certificate__Path: null
      Kestrel__Endpoints__Internal__Certificate__KeyPath: null
- target:
    kind: Deployment
    name: arkya-(characters|content|realms)
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/ports
      value:
      - name: http
        containerPort: 8080
    - op: remove
      path: /spec/template/spec/containers/0/volumeMounts/1
    - op: remove
      path: /spec/template/spec/volumes/1
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
      value: http
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
      value: http
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/port
      value: http
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/scheme
      value: HTTP
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/scheme
      value: HTTP
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/scheme
      value: HTTP
- target:
    kind: Deployment
    name: arkya-characters
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: arkya-characters
    spec:
      template:
        spec:
          containers:
          - name: characters
            envFrom:
            - configMapRef:
                name: arkya-characters-config
            env:
            - name: Mongo__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: arkya-content-secrets
                  key: Mongo__ConnectionString
            - name: Identity__ServiceKey
              valueFrom:
                secretKeyRef:
                  name: arkya-identity-secrets
                  key: ServiceAuthentication__Key
            - name: PlayerAdministration__CharactersKeySeed
              valueFrom:
                secretKeyRef:
                  name: arkya-admin-secrets
                  key: RealmsApi__AdminKey
            - name: RealmRuntime__DedicatedKeySeed
              valueFrom:
                secretKeyRef:
                  name: arkya-admin-secrets
                  key: RealmsApi__AdminKey
            - name: Realms__ServiceKey
              valueFrom:
                secretKeyRef:
                  name: arkya-realms-secrets
                  key: GameAccess__ServiceKey
            volumeMounts:
            - name: internal-ca
              mountPath: /etc/arkya/internal-ca
              $patch: delete
          volumes:
          - name: internal-ca
            $patch: delete
- target:
    kind: Deployment
    name: arkya-characters
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
      value: arkya-characters.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
      value: arkya-characters.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/httpHeaders/0/value
      value: arkya-characters.arkya-beta.svc.cluster.local
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: arkya-identity
      namespace: arkya-beta
    spec:
      template:
        spec:
          containers:
          - name: identity
            env:
            - name: PlayerAdministration__IdentityKeySeed
              valueFrom:
                secretKeyRef:
                  name: arkya-admin-secrets
                  key: ContentApi__AdminKey
- target:
    kind: Deployment
    name: arkya-content
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
      value: arkya-content.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
      value: arkya-content.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/httpHeaders/0/value
      value: arkya-content.arkya-beta.svc.cluster.local
- target:
    kind: Deployment
    name: arkya-realms
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: arkya-realms
    spec:
      replicas: 1
      strategy:
        type: Recreate
        rollingUpdate: null
      template:
        spec:
          serviceAccountName: arkya-realm-deployer
          automountServiceAccountToken: false
          containers:
          - name: realms
            env:
            - name: RealmRuntime__DedicatedKeySeed
              valueFrom:
                secretKeyRef:
                  name: arkya-admin-secrets
                  key: RealmsApi__AdminKey
            volumeMounts:
            - name: kubernetes-api
              mountPath: /var/run/secrets/arkya-kubernetes
              readOnly: true
            - name: registry-credentials
              mountPath: /var/run/secrets/arkya-registry
              readOnly: true
          volumes:
          - name: kubernetes-api
            projected:
              defaultMode: 288
              sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                  - key: ca.crt
                    path: ca.crt
          - name: registry-credentials
            secret:
              secretName: arkya-ghcr
              defaultMode: 288
              items:
              - key: .dockerconfigjson
                path: config.json
- target:
    kind: Deployment
    name: arkya-realms
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
      value: arkya-realms.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/livenessProbe/httpGet/httpHeaders/0/value
      value: arkya-realms.arkya-beta.svc.cluster.local
    - op: replace
      path: /spec/template/spec/containers/0/startupProbe/httpGet/httpHeaders/0/value
      value: arkya-realms.arkya-beta.svc.cluster.local
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: arkya-admin
      namespace: arkya-beta
    spec:
      template:
        spec:
          containers:
          - name: admin
            env:
            - name: Mongo__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: arkya-content-secrets
                  key: Mongo__ConnectionString
            - name: PlayerAdministration__IdentityKeySeed
              valueFrom:
                secretKeyRef:
                  name: arkya-admin-secrets
                  key: ContentApi__AdminKey
            - name: PlayerAdministration__CharactersKeySeed
              valueFrom:
                secretKeyRef:
                  name: arkya-admin-secrets
                  key: RealmsApi__AdminKey
            volumeMounts:
            - mountPath: /etc/arkya/internal-ca
              $patch: delete
          volumes:
          - name: internal-ca
            $patch: delete
- target:
    kind: Service
    name: arkya-(characters|content|realms)
  patch: |-
    - op: replace
      path: /spec/ports
      value:
      - name: http
        port: 8080
        targetPort: http
- target:
    kind: NetworkPolicy
    name: arkya-characters
  patch: |-
    - op: replace
      path: /spec/ingress
      value:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arkya-admin
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arkya-gateway
        - ipBlock:
            cidr: 192.168.100.0/24
        ports:
        - protocol: TCP
          port: 8080
- target:
    kind: NetworkPolicy
    name: arkya-admin
  patch: |-
    - op: replace
      path: /spec/ingress
      value:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arkya-gateway
        ports:
        - protocol: TCP
          port: 8080
- target:
    kind: NetworkPolicy
    name: arkya-(content|realms)
  patch: |-
    - op: replace
      path: /spec/ingress
      value:
      - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arkya-admin
        ports:
        - protocol: TCP
          port: 8080
- target:
    kind: NetworkPolicy
    name: arkya-content
  patch: |-
    - op: add
      path: /spec/ingress/0/from/-
      value:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: arkya-gateway
- target:
    kind: NetworkPolicy
    name: arkya-realms
  patch: |-
    - op: add
      path: /spec/ingress/0/from/-
      value:
        podSelector:
          matchLabels:
            app.kubernetes.io/name: arkya-gateway
