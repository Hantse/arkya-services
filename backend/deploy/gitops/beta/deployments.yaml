apiVersion: apps/v1
kind: Deployment
metadata:
  name: arkya-identity
  namespace: arkya-identity
  labels:
    app.kubernetes.io/name: arkya-identity
    app.kubernetes.io/part-of: arkya
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app.kubernetes.io/name: arkya-identity
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arkya-identity
        app.kubernetes.io/part-of: arkya
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: arkya-ghcr
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: identity
        image: ghcr.io/hantse/arkya-services-identity
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        envFrom:
        - configMapRef:
            name: arkya-identity-config
        - secretRef:
            name: arkya-identity-secrets
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: management
          containerPort: 8081
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: temporary
          mountPath: /tmp
        - name: tls
          mountPath: /etc/arkya/tls
          readOnly: true
        - name: keys
          mountPath: /var/lib/arkya/keys
        readinessProbe:
          httpGet:
            path: /health/ready
            port: management
            httpHeaders:
            - name: Host
              value: api.arkya.online
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: management
            httpHeaders:
            - name: Host
              value: api.arkya.online
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/ready
            port: management
            httpHeaders:
            - name: Host
              value: api.arkya.online
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
      volumes:
      - name: temporary
        emptyDir:
          sizeLimit: 64Mi
      - name: tls
        secret:
          secretName: arkya-identity-tls
          defaultMode: 288
      - name: keys
        persistentVolumeClaim:
          claimName: arkya-identity-keys
---
