apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arkya-gateway
  namespace: arkya-identity
  labels:
    app.kubernetes.io/name: arkya-gateway
    app.kubernetes.io/part-of: arkya
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arkya-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 192.168.100.0/24
    ports:
    - protocol: TCP
      port: 8080
---
