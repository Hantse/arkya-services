apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arkya-identity-keys
  namespace: arkya-identity
  labels:
    app.kubernetes.io/name: arkya-identity-keys
    app.kubernetes.io/part-of: arkya
  annotations:
    # WaitForFirstConsumer binding needs its consuming pod in the same wave.
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arkya-admin-keys
  namespace: arkya-operations
  labels:
    app.kubernetes.io/name: arkya-admin-keys
    app.kubernetes.io/part-of: arkya
  annotations:
    # WaitForFirstConsumer binding needs its consuming pod in the same wave.
    argocd.argoproj.io/sync-wave: '0'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
