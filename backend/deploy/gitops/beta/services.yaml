apiVersion: v1
kind: Service
metadata:
  name: arkya-identity
  namespace: arkya-identity
  labels:
    app.kubernetes.io/name: arkya-identity
    app.kubernetes.io/part-of: arkya
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arkya-identity
  ports:
  - name: http
    port: 8080
    targetPort: http
  - name: https
    port: 8443
    targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: arkya-gateway
  namespace: arkya-identity
  labels:
    app.kubernetes.io/name: arkya-gateway
    app.kubernetes.io/part-of: arkya
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: arkya-gateway
  ports:
  - name: http
    port: 80
    targetPort: http
  loadBalancerIP: 192.168.100.218
  externalTrafficPolicy: Local
---
