apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arkya-inference-dedicateds
  namespace: arkya-beta
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arkya-inference
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: arkya-beta-realm
      podSelector:
        matchLabels:
          app.kubernetes.io/managed-by: arkya-realms
    ports:
    - protocol: TCP
      port: 8080
