apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arkya-native-release-reader
  namespace: arkya-beta
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
rules:
- apiGroups: ['']
  resources: [configmaps]
  resourceNames: [arkya-native-runtime-release]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arkya-native-release-reader
  namespace: arkya-beta
  annotations:
    argocd.argoproj.io/sync-wave: '-5'
subjects:
- kind: ServiceAccount
  name: arkya-realm-deployer
  namespace: arkya-beta
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arkya-native-release-reader
