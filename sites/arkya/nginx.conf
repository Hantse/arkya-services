worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        # Runtime DNS keeps the public site available while the game Service is absent.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        resolver_timeout 5s;
        set $unity_upstream ${ARKYA_UNITY_UPSTREAM};

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /game {
            return 308 /game/;
        }

        location ^~ /game/ {
            proxy_pass http://$unity_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        location ~* ^/assets/.*\.(webp|png|jpe?g|svg|ico)$ {
            try_files $uri =404;
            expires 1h;
        }

        location / {
            try_files $uri $uri/ =404;
            expires -1;
        }
    }
}
