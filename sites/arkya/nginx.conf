worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server_tokens off;

    map $host $realm_public_host {
        default 0;
        "~^(?!(?:www|api|admin|backoffice|beta-game)\.arkya\.online$)[a-z][a-z0-9-]{1,29}[a-z0-9]\.arkya\.online$" 1;
    }
    map $realm_public_host $site_index {
        default index.html;
        1 realm.html;
    }
    # Realm hosts expose their public status page and its static dependencies only.
    map "$realm_public_host:$uri" $realm_path_blocked {
        default 0;
        ~^1:/(?:$|realm\.html$|styles\.css$|realms\.css$|realm-copy\.js$|i18n\.js$|realms\.mjs$|realm-client\.mjs$|favicon\.svg$|assets/) 0;
        ~^1: 1;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        if ($realm_path_blocked) { return 404; }

        # Runtime DNS keeps the public site available while the game Service is absent.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        resolver_timeout 5s;
        set $unity_upstream ${ARKYA_UNITY_UPSTREAM};

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            try_files /$site_index =404;
            expires -1;
        }

        location = /game {
            return 308 /game/;
        }

        location ^~ /game/ {
            proxy_pass http://$unity_upstream$request_uri;
            proxy_set_header Host $host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;
            proxy_buffering off;
            proxy_cache off;
        }

        location ~* ^/assets/.*\.(webp|png|jpe?g|svg|ico)$ {
            try_files $uri =404;
            expires 1h;
        }

        location / {
            try_files $uri $uri/ =404;
            expires -1;
        }
    }
}
