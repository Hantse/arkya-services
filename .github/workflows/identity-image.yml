name: Identity image

on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
      - '.github/workflows/identity-image.yml'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'Directory.*'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/identity-image.yml'
      - 'global.json'
      - 'NuGet.Config'
      - 'nuget.config'
      - 'Directory.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  test:
    name: Identity tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      # Disposable test database, independent of the deployed Identity database.
      mongo:
        image: mongo:8.0
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: backend

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Run Identity tests including MongoDB persistence
        env:
          ARKYA_TEST_MONGO: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/
        run: dotnet test backend/tests/Arkya.Identity.Tests/Arkya.Identity.Tests.csproj --configuration Release --logger "console;verbosity=normal"

  build:
    name: Check multi-platform build
    needs: test
    # Unmerged code can build, but this job has no registry write permission.
    if: github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: backend

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Identity without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.identity
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=identity

  publish:
    name: Publish to GHCR
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: backend

      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-identity" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Identity
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile.identity
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Arkya Identity
            org.opencontainers.image.description=Arkya accounts and Discord authentication service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=min
          cache-from: type=gha,scope=identity
          cache-to: type=gha,mode=max,scope=identity

      - name: Write deployment reference
        env:
          IDENTITY_IMAGE: ${{ steps.image.outputs.name }}
          IDENTITY_DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          {
            printf '## Image Identity publiée\n\n'
            printf 'Tag : `%s:sha-%s`\n\n' "$IDENTITY_IMAGE" "$GITHUB_SHA"
            printf 'Plateformes : `linux/amd64`, `linux/arm64`.\n\n'
            printf 'Valeur à reporter dans `.local/cluster.json` pour le déploiement K8s :\n\n'
            printf '```json\n{ "image": "%s@%s" }\n```\n' "$IDENTITY_IMAGE" "$IDENTITY_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
