name: Reports image

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/reports-image.yml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/reports-image.yml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reports-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    uses: ./.github/workflows/backend-ci.yml

  image:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: backend
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request' && github.repository == 'Hantse/arkya-services' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Reports without activating a deployment
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile.service
          build-args: APPLICATION=Arkya.Reports.Api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.repository == 'Hantse/arkya-services' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ghcr.io/hantse/arkya-services-reports:sha-${{ github.sha }}
          provenance: mode=min
          cache-from: type=gha,scope=services-reports
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=services-reports' || '' }}
      - name: Record digest for explicit activation
        if: github.event_name != 'pull_request' && steps.build.outputs.digest != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Reports image `ghcr.io/hantse/arkya-services-reports@%s`. Activate using docs/BUG_REPORTS.md after provisioning secrets.\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
